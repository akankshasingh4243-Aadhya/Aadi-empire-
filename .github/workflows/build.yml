name: Build Aadi Sovereign Empire Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build aadi-toolkit
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./toolkit/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aadi-toolkit:latest

      - name: Build aadi-gpu-sniper-hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "./1. sniper-hub/Dockerfile"
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aadi-gpu-sniper-hub:latest
          
